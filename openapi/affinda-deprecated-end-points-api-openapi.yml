      required:
      - identifier
      - organization
      - workspace
      - keyProperty
      - displayProperty
      properties:
        identifier:
          type: string
          description: Uniquely identify a mapping data source.
          example: mEFayXdO
          readOnly: true
        name:
          type:
          - string
